services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - .:/code
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build: .
    volumes:
      - .:/code
    env_file:
      - .env
    command: celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy